# MIL-STD-1275E (22 Mar 2013) disturbances applied to one equipment input (DOSSIER 8.5).
# Points are (time s, open-circuit source voltage V), piecewise linear.
# Sourced limits: 5.1.1.1 (20-33 V), 5.1.2.1 IES (>= 12 V, <= 1 s), 5.1.2.2 cranking (>= 16 V, <= 30 s),
# 5.1.3.1.1 spikes (250 V, <= 70 us envelope, rise <= 50 ns, <= 2 J), Fig. 8 / Table I surges
# (100 V, 50 ms, rise 1-10 ms, 500 mOhm, <= 60 J), Fig. 8 low surge (18 V for 500 ms),
# 4.1 / 5.3.4 reverse polarity (33 V for 5 min).
# Wave shapes inside the envelopes are this project's choice (basis: derived), listed per case.
cases:
  surge_100v:
    note: Table I positive surge; 5 ms linear rise, then exponential decay to V10% at 50 ms (Fig. 4 shape)
    r_s: 0.5
    t_end: 0.20
    dt: 2.0e-6
    kind: surge_exp
    v_nom: 28.0
    v_peak: 100.0
    t_on: 0.010
    t_rise: 0.005
    t_width: 0.050
    src: [MIL1275E]
  surge_flat_100v:
    note: Fig. 8 envelope taken literally as 100 V held for 50 ms (worst case for the series FET)
    r_s: 0.5
    t_end: 0.20
    dt: 2.0e-6
    points: [[0.0, 28.0], [0.010, 28.0], [0.011, 100.0], [0.061, 100.0], [0.062, 28.0], [0.20, 28.0]]
    src: [MIL1275E]
  low_surge_18v:
    note: Fig. 8 lower limit, 18 V for 500 ms
    r_s: 0.02
    t_end: 1.0
    dt: 2.0e-5
    points: [[0.0, 28.0], [0.05, 28.0], [0.051, 18.0], [0.551, 18.0], [0.552, 28.0], [1.0, 28.0]]
    src: [MIL1275E]
  starting:
    note: Fig. 6 lower envelope, IES at 12 V for 1 s then cranking at 16 V to 30 s; repeated IES 1 s apart
    r_s: 0.02
    t_end: 33.0
    dt: 2.0e-4
    points: [[0.0, 28.0], [0.5, 28.0], [0.501, 12.0], [1.5, 12.0], [1.501, 16.0], [30.5, 16.0], [30.6, 28.0], [33.0, 28.0]]
    src: [MIL1275E]
  spike_pos:
    note: +250 V, rise 50 ns, damped 250 kHz ring inside a 70 us envelope; source impedance set so a matched load takes 2 J (worst case allowed)
    r_s: 0.12
    t_end: 2.0e-4
    dt: 2.0e-8
    kind: spike
    v_nom: 28.0
    v_peak: 250.0
    t_on: 2.0e-5
    t_rise: 5.0e-8
    f_ring: 250000.0
    t_env: 7.0e-5
    src: [MIL1275E]
  spike_neg:
    note: -250 V version of spike_pos
    r_s: 0.12
    t_end: 2.0e-4
    dt: 2.0e-8
    kind: spike
    v_nom: 28.0
    v_peak: -250.0
    t_on: 2.0e-5
    t_rise: 5.0e-8
    f_ring: 250000.0
    t_env: 7.0e-5
    src: [MIL1275E]
  reverse_polarity:
    note: 4.1 / 5.3.4, -33 V applied (5 min in the test; 2 s simulated, the state is static)
    r_s: 0.02
    t_end: 2.0
    dt: 1.0e-4
    points: [[0.0, 28.0], [0.1, 28.0], [0.101, -33.0], [1.6, -33.0], [1.601, 28.0], [2.0, 28.0]]
    src: [MIL1275E]
  ripple:
    note: 1275E 5.1.1.2 points to 461G CS101; Fig. CS101-1 curve 2 (28 V and below) is 126 dBuV = 2.0 V rms flat at low frequency (falling to 96.5 dBuV at 150 kHz). Modelled as 2.0 V rms (5.66 Vpp) at 1 kHz on 23 V, the 1275E 5.3.1.2 low test voltage
    r_s: 0.02
    t_end: 0.02
    dt: 2.0e-6
    kind: ripple
    v_nom: 23.0
    v_pp: 5.66
    f: 1000.0
    src: [MIL1275E, MIL461G]

  # --- MIL-STD-1275F (7 Sep 2022), the revision in force [MIL1275F] -----------------------------
  f_surge:
    note: 1275F Table II / Fig. 12 two-stage generator - 100 V held 50 ms (switch 1), then decaying through the 20 Ohm / 0.2 F stage to 33 V at 500 ms (switch 2 opens); Vnom 30 V; 500 mOhm. Decay shape fitted to the Fig. 8 points (derived)
    r_s: 0.5
    t_end: 0.8
    dt: 4.0e-6
    kind: surge_f
    v_nom: 30.0
    v_peak: 100.0
    t_on: 0.02
    t_rise: 0.005
    t1: 0.05
    t2: 0.5
    v_t2: 33.0
    src: [MIL1275F]
  f_spike_pos:
    note: 1275F 5.3.3.1.1 / Fig. 10 - 8.2 uF storage capacitor charged to +250 V switched onto the input (energy-limited, 256 mJ stored, 200 mJ max delivered); source resistance 50 mOhm per the Fig. 10 DC limits (derived)
    r_s: 0.05
    t_end: 4.0e-4
    dt: 2.0e-8
    kind: cap_spike
    v_nom: 28.0
    cap_f: 8.2e-6
    cap_v0: 250.0
    t_on: 2.0e-5
    src: [MIL1275F]
  f_spike_neg:
    note: as f_spike_pos, -250 V
    r_s: 0.05
    t_end: 4.0e-4
    dt: 2.0e-8
    kind: cap_spike
    v_nom: 28.0
    cap_f: 8.2e-6
    cap_v0: -250.0
    t_on: 2.0e-5
    src: [MIL1275F]
  f_ripple:
    note: 1275F 5.1.1.2.1 - 4 V p-p, 30 Hz-5 kHz; applied at 5 kHz on the 20 V lower steady limit (worst point, dips to 18 V)
    r_s: 0.02
    t_end: 0.004
    dt: 1.0e-6
    kind: ripple
    v_nom: 20.0
    v_pp: 4.0
    f: 5000.0
    src: [MIL1275F]
  f_starting:
    note: 1275F Table I - six starting events, >= 1 s apart - 20 V 1 s, IES 12 V 1 s, 20 V 1 s, IES 12 V 1 s, 20 V 1 s, IES 12 V 1 s then cranking 16 V 30 s
    r_s: 0.02
    t_end: 44.0
    dt: 2.0e-4
    points: [[0, 28], [0.5, 28], [0.501, 20], [1.5, 20], [1.501, 28], [2.5, 28], [2.501, 12], [3.5, 12], [3.501, 28], [4.5, 28], [4.501, 20], [5.5, 20], [5.501, 28], [6.5, 28], [6.501, 12], [7.5, 12], [7.501, 28], [8.5, 28], [8.501, 20], [9.5, 20], [9.501, 28], [10.5, 28], [10.501, 12], [11.5, 12], [11.501, 16], [41.5, 16], [41.6, 28], [44.0, 28]]
    src: [MIL1275F]
  li_start_14v4:
    note: Interface conflict case - what a single Li-ion 6T start battery may legally put on a shared bus below 0 degC (MIL-PRF-32565C Table I minimum cranking voltage 14.4 V for 30 s), after a 12 V IES; outside the 1275 cranking envelope (16 V)
    r_s: 0.02
    t_end: 34.0
    dt: 2.0e-4
    points: [[0, 28], [0.5, 28], [0.501, 12], [1.5, 12], [1.501, 14.4], [31.5, 14.4], [31.6, 28], [34.0, 28]]
    src: [MIL32565C]

front_ends:
  # v1: first design, a common 36 V TVS directly at the input and a surge stopper behind it
  v1_tvs36:
    v_br: 36.0
    r_dyn: 0.15
    tvs_pulse_j: 3.0
    basis: assumed
  # v2: TVS above the surge peak (spikes only), series FET rated for the spike residual, hold-up
  # for the 1 s IES at 12 V handled by a 9-36 V wide-input DC/DC
  v2_final:
    v_br: 122.0
    r_dyn: 0.05
    tvs_pulse_j: 15.0
    basis: assumed
