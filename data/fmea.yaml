# FMEA of the 28 V power system (DOSSIER 12.1). Columns after Wasson Fig. 34.20 (DA Form 7610 layout):
# item, failure mode, local / next-higher / end effect, detection, compensating provision, severity
# (MIL-STD-882E Table I, 1-4), probability (Table II, A-F), and the test that verifies the provision.
# Probabilities are qualitative engineering judgement (ASSUMED) over a fleet life.
rows:
  - {id: FM01, item: Mission bank block (Li-ion 6T), mode: "Internal short / BMS opens the block", local: "block isolated", next: "mission bank capacity -1/n", end: "silent watch shorter by 1/n", detect: "BMS on the battery CAN bus; SOC jump", provision: "one spare block (k = n-1); controller sheds by SOC", sev: 3, prob: C, verify: [IT-RMA, UT-BAT]}
  - {id: FM02, item: Mission bank block (Li-ion 6T), mode: "Thermal runaway", local: "fire / gas in the battery box", next: "loss of mission bank", end: "crew hazard", detect: "BMS temperature + box gas/temperature sensor", provision: "batteries outside the crew compartment, vented box, spec abuse tests (32565 SAE J2464 HSL <= 6)", sev: 1, prob: E, verify: [QUAL-32565]}
  - {id: FM03, item: Start bank (6T AGM 2s2p), mode: "Drained by keep-alive loads during a long watch", local: "low SOC", next: "crank voltage below 16 V", end: "vehicle cannot move", detect: "start-bank voltage monitor", provision: "split banks; keep-alive load budget; crank-reserve check before watch", sev: 2, prob: C, verify: [IT-CRANK, UT-RES]}
  - {id: FM04, item: Start bank (6T AGM 2s2p), mode: "Cold soak at C2 (-46 degC)", local: "R0 and capacity collapse", next: "crank fails", end: "vehicle cannot move", detect: "battery temperature", provision: "fuel-fired pre-heater / winterisation kit (allocated outside this system)", sev: 2, prob: C, verify: [IT-CRANK]}
  - {id: FM05, item: Combiner relay, mode: "Welded closed", local: "banks stay joined in silent watch", next: "start bank drains with the mission bank", end: "engine-start reserve lost", detect: "start/mission bank voltages equal with engine off (PMC check)", provision: "PMC alarm; second series contactor", sev: 2, prob: D, verify: [UT-CTRL-COMB]}
  - {id: FM06, item: Combiner relay, mode: "Fails open", local: "start bank not charged", next: "start bank slowly drains", end: "late cold-start failure", detect: "start-bank SOC trend", provision: "PMC alarm; manual parallel switch", sev: 3, prob: D, verify: [UT-CTRL-COMB]}
  - {id: FM07, item: Battery monitor (SOC), mode: "SOC estimate drifts high", local: "controller sheds late", next: "bank reaches the floor unexpectedly", end: "essential suite drops suddenly", detect: "fast under-voltage shed and LVD on bus voltage (independent of SOC)", provision: "two independent protections in FB_PowerMgmt (voltage and SOC)", sev: 3, prob: C, verify: [UT-CTRL-UV, UT-CTRL-LVD]}
  - {id: FM08, item: Power-management controller, mode: "Stops (software / hardware)", local: "no shedding, no LVD", next: "bank over-discharged", end: "C4ISR lost at the floor; battery damage", detect: "SSPC watchdog loss of heartbeat", provision: "SSPC default states: P1 on, others off; BMS cut-off as last protection", sev: 2, prob: D, verify: [DEMO-WDT]}
  - {id: FM09, item: SSPC channel, mode: "Fails open", local: "one load lost", next: "function lost", end: "e.g. command net down", detect: "SSPC status + undercurrent flag", provision: "vital loads on separate channels; crew can move a radio to a spare channel", sev: 3, prob: D, verify: [UT-SSPC]}
  - {id: FM10, item: SSPC channel, mode: "Fails short (cannot switch off)", local: "load stays on", next: "no shedding of that load", end: "watch shorter", detect: "current while commanded off", provision: "PMC alarm; next-level shed compensates", sev: 4, prob: D, verify: [UT-SSPC]}
  - {id: FM11, item: Wiring, mode: "Chafe to chassis / bolted short", local: "high fault current", next: "channel trips", end: "one load lost, no fire", detect: "SSPC instant trip (250 us class)", provision: "SSPC trip curve below wire damage curve on every channel", sev: 3, prob: C, verify: [UT-SSPC-COORD]}
  - {id: FM12, item: Wiring, mode: "Series arc / loose terminal; intermittent parallel arc", local: "local heating, arcing", next: "intermittent load", end: "possible fire behind panels", detect: "FB_ArcDetect in each SSPC: 5-20 kHz band energy + extinction dips (series), repeated bursts (parallel); held-out tests in DOSSIER 9.3", provision: "SSPC opens the channel; vital channels follow the retry/latch rule of SR-36", sev: 2, prob: D, verify: [IT07]}
  - {id: FM13, item: Equipment front end, mode: "100 V load-dump surge", local: "input over-voltage", next: "equipment damage", end: "loss of the equipment", detect: "-", provision: "surge stopper FET + TVS above the surge level (front end v3)", sev: 3, prob: C, verify: [UT-TRANS]}
  - {id: FM14, item: Environmental control unit, mode: "Fails", local: "no cooling", next: "compartment above 40 degC in hot climates", end: "crew heat stress, equipment over-temperature", detect: "zone temperature (TBay)", provision: "BayHot shed to cut heat; time-to-limit known (DOSSIER 8.6)", sev: 3, prob: C, verify: [UT-CTRL-BAY]}
  - {id: FM15, item: APU, mode: "Fails to start", local: "no charging", next: "bank discharges", end: "watch limited to battery endurance", detect: "APU status", provision: "battery sized for the threshold alone (A2 inside A5)", sev: 3, prob: C, verify: [IT-RMA]}
  - {id: FM16, item: Alternator / regulator, mode: "Regulator fails high", local: "bus above 33 V", next: "equipment stress, battery overcharge", end: "battery damage", detect: "bus over-voltage monitor", provision: "regulator OVP; BMS charge cut-off; front-end clamp 36 V", sev: 3, prob: D, verify: [UT-TRANS]}
